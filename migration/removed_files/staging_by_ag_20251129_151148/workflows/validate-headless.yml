name: Validate Headless

on:
  push:
    branches: [ feature/ag-godot-integration ]
  pull_request:
    branches: [ feature/ag-godot-integration ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.2.1
          
      - name: Run Validation
        shell: pwsh
        run: |
          ./tools/run_and_log.ps1 -GodotExe godot -ProjectPath . -Mode scene
          
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: godot-logs
          path: logs/
